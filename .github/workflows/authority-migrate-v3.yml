name: Authority Migration V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate canonical authorities
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          controller = root / 'src/roblox/ServerScriptService/VoidHunterWeaponController.luau'
          text = controller.read_text(encoding='utf-8')

          # Remove only the known compatibility layer.
          text, removed = re.subn(
              r'\n-- Compatibility views over ComponentAuthority\..*?\n-- Rate limiting',
              '\n-- Rate limiting', text, count=1, flags=re.S)

          # Canonical imports.
          anchor = 'local TeamIdentity = require(ReplicatedStorage.Shared.Combat:WaitForChild("TeamIdentity"))'
          if 'local ShipRegistry = ' not in text and anchor in text:
              text = text.replace(anchor, anchor + '\nlocal ShipRegistry = require(ReplicatedStorage.Shared.Ship:WaitForChild("ShipRegistry"))', 1)

          # Canonical component type lookup.
          legacy_type = '''local function getComponentType(part)\n\tif not part or not part:IsA("BasePart") then return nil end\n\tlocal explicit = part:GetAttribute("ComponentType")\n\tif typeof(explicit) == "string" and Components.Types[explicit] then\n\t\treturn explicit\n\tend\n\tfor typeName, def in pairs(Components.Types) do\n\t\tif def.Name == part.Name then\n\t\t\treturn typeName\n\t\tend\n\tend\n\treturn nil\nend'''
          canonical_type = '''local function getComponentType(part: BasePart): string?\n\tlocal state = ComponentAuthority.Get(part) or ComponentAuthority.Bind(part)\n\treturn state and state.TypeName or nil\nend'''
          if legacy_type in text:
              text = text.replace(legacy_type, canonical_type, 1)

          # Registry-based nearest ship search.
          legacy_scan = '''\tfor _, obj in ipairs(workspace:GetDescendants()) do\n\t\tif obj:IsA("Model") and obj:GetAttribute("IsShip") and obj ~= ship then\n\t\t\tlocal objPos = obj.PrimaryPart and obj.PrimaryPart.Position or obj:GetPivot().Position\n\t\t\tlocal dist = (objPos - shipPos).Magnitude\n\t\t\tif dist < nearestDist then\n\t\t\t\tnearestDist = dist\n\t\t\t\tnearest = obj\n\t\t\tend\n\t\tend\n\tend'''
          canonical_scan = '''\tfor _, obj in pairs(ShipRegistry.GetAll()) do\n\t\tif obj ~= ship then\n\t\t\tlocal objPos = obj.PrimaryPart and obj.PrimaryPart.Position or obj:GetPivot().Position\n\t\t\tlocal dist = (objPos - shipPos).Magnitude\n\t\t\tif dist < nearestDist then\n\t\t\t\tnearestDist = dist\n\t\t\t\tnearest = obj\n\t\t\tend\n\t\tend\n\tend'''
          if legacy_scan in text:
              text = text.replace(legacy_scan, canonical_scan, 1)

          # Registry-based ownership check.
          legacy_validate = '''local function validateShip(player, ship)\n\tif not ship or not ship.Parent then\n\t\treturn false, "Invalid ship"\n\tend\n\tlocal ownerId = ship:GetAttribute("OwnerId")\n\tif ownerId and ownerId ~= player.UserId then\n\t\treturn false, "Ship ownership mismatch"\n\tend\n\tif not ship:GetAttribute("IsShip") then\n\t\treturn false, "Not a valid ship"\n\tend\n\treturn true\nend'''
          canonical_validate = '''local function validateShip(player: Player, ship: Model): (boolean, string?)\n\tif not ship or not ship.Parent then\n\t\treturn false, "Invalid ship"\n\tend\n\tif not ship:GetAttribute("IsShip") then\n\t\treturn false, "Not a valid ship"\n\tend\n\tif not ShipRegistry.IsOwner(player, ship) then\n\t\treturn false, "Ship ownership mismatch"\n\tend\n\treturn true\nend'''
          if legacy_validate in text:
              text = text.replace(legacy_validate, canonical_validate, 1)

          text = text.replace('pairs(activeShips or {})', 'pairs(ShipRegistry.GetAll())')

          # Modern scheduling in live code only.
          live = [p for p in (root/'src/roblox').rglob('*.luau') if 'SharedSource' not in p.parts]
          controller.write_text(text, encoding='utf-8')
          for path in live:
              s = path.read_text(encoding='utf-8')
              s2 = re.sub(r'(?<!task\.)\bspawn\s*\(', 'task.spawn(', s)
              s2 = re.sub(r'(?<!task\.)\bwait\s*\(', 'task.wait(', s2)
              s2 = re.sub(r'(?<!task\.)\bdelay\s*\(', 'task.delay(', s2)
              if s2 != s:
                  path.write_text(s2, encoding='utf-8')

          # Report residual live code, without touching raw/evidence.
          live = [p for p in (root/'src/roblox').rglob('*.luau') if 'SharedSource' not in p.parts]
          live_text = '\n'.join(p.read_text(encoding='utf-8') for p in live)
          patterns = {
              'partHealth': r'\bpartHealth\b',
              'partMaxHealth': r'\bpartMaxHealth\b',
              'activeShips': r'\bactiveShips\b',
              'legacy_spawn': r'(?<!task\.)\bspawn\s*\(',
              'legacy_wait': r'(?<!task\.)\bwait\s*\(',
              'legacy_delay': r'(?<!task\.)\bdelay\s*\(',
          }
          report = ['# Authority Migration Residue Report', '']
          for name, pat in patterns.items():
              report.append(f'- {name}: {len(re.findall(pat, live_text))}')
          report += ['', 'Generated from live Roblox/Luau code only. Raw forensic sources are excluded.']
          (root/'VOIDA/MIGRATION_RESIDUE_REPORT.md').write_text('\n'.join(report)+'\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Commit migrated files and remove runner
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/roblox VOIDA/MIGRATION_RESIDUE_REPORT.md
          git rm .github/workflows/authority-migrate-v3.yml
          git commit -m "chore: complete authoritative Luau migration"
          git push origin main
